<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elemental</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:-apple-system,'Segoe UI',Roboto,sans-serif; background:#0f1a14; color:#e9f5ec; min-height:100vh; padding:18px 12px 50px; }
  .wrap { max-width:560px; margin:0 auto; }
  header { text-align:center; margin-bottom:12px; }
  header h1 { font-size:26px; }
  header .tag { color:#7da98c; font-size:12px; }
  a { color:#6ee7a0; text-decoration:none; }
  .bar { display:flex; gap:8px; justify-content:center; margin-bottom:12px; flex-wrap:wrap; }
  .pill { background:#173324; border:1px solid #26543a; color:#a9d8ba; border-radius:999px; padding:7px 14px; font-size:12.5px; font-weight:600; cursor:pointer; }
  .pill.on { background:#6ee7a0; color:#0f1a14; border-color:#6ee7a0; }
  .hud { display:flex; justify-content:center; gap:26px; margin-bottom:12px; font-variant-numeric:tabular-nums; }
  .hud .c { text-align:center; }
  .hud .v { font-size:21px; font-weight:800; }
  .hud .k { font-size:10px; color:#7da98c; text-transform:uppercase; letter-spacing:1px; }
  .qcard { background:#152b1e; border:1px solid #26543a; border-radius:16px; padding:24px; text-align:center; margin-bottom:12px; }
  .tile { display:inline-flex; flex-direction:column; align-items:center; background:#0f1a14; border:2px solid #6ee7a0; border-radius:12px; padding:14px 22px; margin-bottom:8px; }
  .tile .big { font-size:40px; font-weight:800; }
  .tile .q { font-size:11px; color:#7da98c; margin-top:2px; }
  .opts { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .opt { background:#173324; border:1px solid #26543a; color:#e9f5ec; border-radius:12px; padding:15px 10px; font-size:15.5px; font-weight:600; cursor:pointer; }
  .opt:hover { border-color:#6ee7a0; }
  .opt.right { background:#14532d; border-color:#22c55e; }
  .opt.wrong { background:#4c1d1d; border-color:#ef4444; }
  .opt:disabled { cursor:default; opacity:.85; }
  #msg { text-align:center; min-height:22px; font-size:13.5px; color:#a9d8ba; margin-top:10px; }
  #final { display:none; text-align:center; background:#152b1e; border:1px solid #26543a; border-radius:16px; padding:24px; }
  #final .score { font-size:32px; font-weight:800; color:#6ee7a0; }
  #final .grade { font-size:17px; font-weight:700; margin:6px 0 12px; }
  #misses { text-align:left; font-size:13px; color:#a9d8ba; margin:10px auto 14px; max-width:340px; line-height:1.7; }
  .btn { background:#6ee7a0; color:#0f1a14; border:none; border-radius:999px; padding:11px 30px; font-size:14.5px; font-weight:800; cursor:pointer; }
  .best { color:#7da98c; font-size:11.5px; text-align:center; margin-top:12px; }
  .note { text-align:center; color:#46604f; font-size:11.5px; margin-top:14px; line-height:1.6; }
</style>
</head>
<body>
<div class="wrap">
  <header><h1>&#129504; Elemental</h1><div class="tag">the periodic table quiz. symbols, names, numbers.</div></header>
  <div class="bar">
    <button class="pill on" data-mode="s2n">Symbol &#8594; Name</button>
    <button class="pill" data-mode="n2s">Name &#8594; Symbol</button>
    <button class="pill" data-mode="num">Atomic number</button>
  </div>
  <div class="hud">
    <div class="c"><div class="v" id="q">1</div><div class="k">question / <span id="total">10</span></div></div>
    <div class="c"><div class="v" id="score">0</div><div class="k">correct</div></div>
  </div>
  <div id="game">
    <div class="qcard">
      <div class="tile"><div class="big" id="prompt"></div><div class="q" id="promptSub"></div></div>
    </div>
    <div class="opts" id="opts"></div>
    <div id="msg"></div>
  </div>
  <div id="final">
    <div style="font-size:13px;color:#7da98c">round over</div>
    <div class="score" id="finalScore"></div>
    <div class="grade" id="finalGrade"></div>
    <div id="misses"></div>
    <button class="btn" id="again">Play again</button>
  </div>
  <div class="best" id="best"></div>
  <div class="note">Tricky distractors: wrong options share the first letter.<br><a href="index.html">about</a></div>
</div>
<script src="engine.js?v=1"></script>
<script>
var ROUNDS=10;
var S={mode:'s2n',q:0,score:0,cur:null,asked:[],misses:[],locked:false};
function $(id){return document.getElementById(id);}
function bestKey(){ return 'elemental-best-'+S.mode; }
function best(){ try{return +localStorage.getItem(bestKey())||0;}catch(_){return 0;} }
function saveBest(v){ try{localStorage.setItem(bestKey(),v);}catch(_){}}
function newRun(){
  S.q=0; S.score=0; S.asked=[]; S.misses=[];
  $('final').style.display='none';
  $('game').style.display='block';
  $('score').textContent='0';
  nextQ();
  renderBest();
}
function nextQ(){
  S.cur=makeQuestion(S.mode,S.asked);
  S.asked.push(S.cur.el.s);
  S.locked=false;
  $('q').textContent=S.q+1;
  $('prompt').textContent=questionLabel(S.mode,S.cur.el);
  $('promptSub').textContent = S.mode==='s2n'?'which element is this?':(S.mode==='n2s'?'pick the symbol':'atomic number?');
  var s='';
  S.cur.options.forEach(function(o,i){
    s+='<button class="opt" data-i="'+i+'">'+optionLabel(S.mode,o)+'</button>';
  });
  $('opts').innerHTML=s;
  $('msg').textContent='';
  document.querySelectorAll('.opt').forEach(function(b){ b.onclick=function(){ answer(+b.dataset.i); }; });
}
function answer(i){
  if(S.locked) return;
  S.locked=true;
  var right=S.cur.answer;
  var opts=document.querySelectorAll('.opt');
  opts.forEach(function(b,j){
    b.disabled=true;
    if(j===right) b.classList.add('right');
    else if(j===i) b.classList.add('wrong');
  });
  if(i===right){
    S.score++;
    $('score').textContent=S.score;
    $('msg').textContent='Correct.';
  } else {
    S.misses.push(questionLabel(S.mode,S.cur.el)+' = '+optionLabel(S.mode,S.cur.el));
    $('msg').textContent='It was '+optionLabel(S.mode,S.cur.el)+'.';
  }
  setTimeout(function(){
    S.q++;
    if(S.q>=ROUNDS) finish();
    else nextQ();
  }, 900);
}
function finish(){
  $('game').style.display='none';
  $('final').style.display='block';
  var nb='';
  if(S.score>best()){ saveBest(S.score); nb=' New best!'; }
  $('finalScore').textContent=S.score+' / '+ROUNDS;
  $('finalGrade').textContent=grade(S.score,ROUNDS)+nb;
  $('misses').innerHTML=S.misses.length?('<b>review:</b><br>'+S.misses.join('<br>')):'Clean round - nothing missed.';
  renderBest();
}
$('again').onclick=newRun;
document.querySelectorAll('[data-mode]').forEach(function(b){
  b.onclick=function(){
    S.mode=b.dataset.mode;
    document.querySelectorAll('[data-mode]').forEach(function(x){ x.classList.toggle('on',x===b); });
    newRun();
  };
});
function renderBest(){ $('best').textContent=best()?('best on this mode: '+best()+'/'+ROUNDS):''; }
newRun();
</script>
</body>
</html>
